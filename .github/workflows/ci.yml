name: Platform CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  FJS_HEAP_LIMIT_ROW_ITERATIONS: '200'

jobs:
  platform:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Actual probe inputs
        run: |
          git rev-parse HEAD
          uname -a
          shasum -a 256 packages/fjs/libfjs/Cargo.lock packages/fjs/libfjs/vendor/rquickjs-sys/build.rs packages/fjs/libfjs/vendor/rquickjs-sys/quickjs/quickjs.c packages/fjs/libfjs/src/tests/memory_tests.rs
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/fjs/libfjs/target
          key: native-${{ matrix.target }}-${{ hashFiles('packages/fjs/libfjs/Cargo.lock', 'packages/fjs/libfjs/vendor/**', '.github/workflows/ci.yml') }}
          restore-keys: native-${{ matrix.target }}-
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config libssl-dev
      - name: Apple libclang
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(dirname "$(xcrun --find clang)")/../lib" >> "$GITHUB_ENV"
      - name: Standalone and full-suite strict reproduction
        run: |
          set +e
          set -o pipefail
          cargo test --locked --manifest-path packages/fjs/libfjs/Cargo.toml --target '${{ matrix.target }}' single_request -- --nocapture 2>&1 | tee single-request.log
          standalone=$?
          grep -Eq 'test result: ok\. 1 passed;' single-request.log || standalone=1
          grep -Fq '0 lost the report, 0 left the engine unusable, 200 runs.' single-request.log || standalone=1
          cargo test --locked --manifest-path packages/fjs/libfjs/Cargo.toml --target '${{ matrix.target }}' -- --nocapture 2>&1 | tee full-suite.log
          suite=$?
          grep -Fq '0 lost the report, 0 left the engine unusable, 200 runs.' full-suite.log || suite=1
          printf 'standalone=%s full_suite=%s\n' "$standalone" "$suite" | tee probe-status.log
          test "$standalone" = 0 && test "$suite" = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: probe-111-${{ matrix.platform }}
          path: |
            single-request.log
            full-suite.log
            probe-status.log
          if-no-files-found: error
