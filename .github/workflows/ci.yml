name: Platform CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: '2'
  # The heap-limit rows are 200-run rows on the probe branch (#111).
  FJS_HEAP_LIMIT_ROW_ITERATIONS: '200'
  # pubspec.lock records the host every package came from, and this project
  # resolves against the mirror; the runners reach both it and its storage host
  # (probed 2026-09-16). A run without this variable rewrites all 105 `url:`
  # lines and then fails `flutter pub get --enforce-lockfile`.
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  platform:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: macos
            os: macos-15
            target: aarch64-apple-darwin
          - platform: android
            os: ubuntu-24.04
            target: aarch64-linux-android
          - platform: ios
            os: macos-15
            target: aarch64-apple-ios-sim
    runs-on: ${{ matrix.os }}
    # 90 rather than 60: the Linux and macOS jobs gain a release native build and
    # the runtime-limits harness (three QuickJS probe compiles, eleven product
    # cases and a second gate sweep), and the mobile jobs now build the app. A
    # job timeout would kill those rows instead of recording them. (#68)
    timeout-minutes: 90
    # The Darwin platforms build through CocoaPods, not Swift Package Manager:
    # the vendored `fjs` package's SwiftPM target is a *binary* target that
    # expects `Binaries/fjs.xcframework.zip`, which only exists once someone has
    # built it (the upstream package downloads it from its own release), while
    # this product builds every native platform from its vendored source. The
    # Podfile's script phase is that build for iOS and macOS. Flutter 3.44
    # enables SwiftPM by default and would otherwise inject it into the project
    # and fail at package resolution. (#68)
    env:
      FLUTTER_SWIFT_PACKAGE_MANAGER: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/fjs/libfjs/target
          key: native-${{ matrix.target }}-${{ hashFiles('packages/fjs/libfjs/Cargo.lock', 'packages/fjs/libfjs/vendor/**', '.github/workflows/ci.yml') }}
          restore-keys: native-${{ matrix.target }}-
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # clang/cmake/ninja/pkg-config and libclang build the native library on
          # every Linux job. Only the Linux desktop job needs the GTK 3, lzma and
          # libstdc++ development packages that `flutter build linux` links
          # against, so the Android job does not pay for them. (#68)
          desktop=''
          if [ '${{ matrix.platform }}' = 'linux' ]; then
            desktop='libgtk-3-dev liblzma-dev libstdc++-12-dev'
          fi
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config libssl-dev $desktop
      - name: Windows libclang
        if: runner.os == 'Windows'
        run: echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
      - name: Apple libclang
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(dirname "$(xcrun --find clang)")/../lib" >> "$GITHUB_ENV"
      - name: Android NDK toolchain
        if: matrix.platform == 'android'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          toolchain="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64"
          echo "CC_aarch64_linux_android=$toolchain/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$toolchain/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$toolchain/sysroot --target=aarch64-linux-android26" >> "$GITHUB_ENV"
      - name: Android JDK
        if: matrix.platform == 'android'
        run: |
          # The app build runs AGP 8.13.1, which needs JDK 17 or newer (the
          # native cross-build above only needs the sdkmanager's Java). The
          # runner image installs several JDKs and exports each as
          # JAVA_HOME_<version>_X64; the `:?` fails this step loudly if the image
          # ever stops providing 17 instead of building with whatever `java`
          # happens to be first on PATH. (#68)
          echo "JAVA_HOME=${JAVA_HOME_17_X64:?the runner image no longer exports JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
      - name: Build native runtime
        run: cargo build --locked --manifest-path packages/fjs/libfjs/Cargo.toml --target '${{ matrix.target }}'
      - name: HTML adapter tests
        if: matrix.platform != 'android' && matrix.platform != 'ios'
        run: cargo test --locked --manifest-path packages/fjs/liber_html/Cargo.toml
      - name: Text engine tests
        if: matrix.platform != 'android' && matrix.platform != 'ios'
        run: cargo test --locked --manifest-path packages/fjs/liber_text/Cargo.toml
      # The crate the whole source runtime depends on carried a failing test that
      # no job ran (ticket #34). The host target is the matrix target on every
      # desktop job, so this test build reuses the native build from "Build
      # native runtime" above instead of compiling the same dependency graph for
      # the host a second time.
      - name: Runtime tests
        if: matrix.platform != 'android' && matrix.platform != 'ios'
        run: cargo test --locked --manifest-path packages/fjs/libfjs/Cargo.toml --target '${{ matrix.target }}' -- --nocapture
      # Every job builds its platform's app now, so Flutter is installed for the
      # mobile jobs too; only the Dart tests stay desktop-only. (#68)
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Flutter dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze and shared tests
        if: matrix.platform != 'android' && matrix.platform != 'ios'
        run: |
          dart analyze lib test integration_test tool
          flutter test test
      - name: Generated tree is current
        if: matrix.platform == 'linux'
        run: |
          # Every generated artifact is regenerated and then required to be
          # unchanged: build_runner's output, the drift schema snapshots, the
          # generated migration steps and the generated migration fixtures. A
          # schema change that never got a version, a step or a snapshot has to
          # fail here rather than in a user's library. (`--delete-conflicting-
          # outputs` is gone in build_runner 2.15: `build` alone is current.)
          dart run build_runner build
          dart run drift_dev schema dump lib/store/database.dart drift_schemas/
          dart run drift_dev schema steps drift_schemas/ lib/store/schema_versions.dart
          dart run drift_dev schema generate --data-classes --companions drift_schemas/ test/generated_migrations/
          # `git diff` ignores line-ending churn (core.autocrlf), so this gate
          # says the same thing on Windows as it does on Linux. Untracked output
          # is checked separately: a diff cannot see a file that is not there.
          paths='lib test integration_test tool drift_schemas'
          if ! git diff --quiet -- $paths; then
            echo '生成物与源不一致，请重新生成并提交：'
            git diff --stat -- $paths
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- $paths)"
          if [ -n "$untracked" ]; then
            echo '有未提交的生成物：'
            echo "$untracked"
            exit 1
          fi
      # One app build per platform. Windows stays first: its gates load the DLL
      # the build drops into the runner's Debug directory (tool/ci_runtime.py,
      # library_path). The other four are the P4 shell rows — an app that builds,
      # which is a build verdict and never a runtime one (ADR 0002/0009). (#68)
      - name: Build Windows app
        if: matrix.platform == 'windows'
        run: flutter build windows --debug --no-pub
      - name: Build Linux app
        if: matrix.platform == 'linux'
        run: flutter build linux --debug --no-pub
      - name: Build macOS app
        if: matrix.platform == 'macos'
        run: flutter build macos --debug --no-pub
      - name: Build Android app
        if: matrix.platform == 'android'
        run: flutter build apk --debug --no-pub
      - name: Build iOS app
        if: matrix.platform == 'ios'
        run: flutter build ios --simulator --no-codesign --no-pub
      - name: Runtime gates
        if: matrix.platform != 'android' && matrix.platform != 'ios'
        run: python tool/ci_runtime.py '${{ matrix.platform }}' '${{ matrix.target }}'
      # `tool/ci_runtime.py` recreates `.ci-results/` when it starts, so a row
      # written by a build step would be deleted before the artifact upload. The
      # build rows are recorded here instead, once the gates have written theirs:
      # each names the artifact the build produced (path, sha256, bytes) and, for
      # a bundled app, the package directory around it, so the uploaded
      # `evidence-<platform>` artifact records what was built rather than leaving
      # it in a log. (`tool/ci_runtime.py` gains no build rows: a build in that
      # list would run the build twice.)
      - name: Record app build rows
        run: python tool/ci_build_row.py '${{ matrix.platform }}'
      # The limits harness is platform-neutral, but it has only ever run on
      # Windows: its compiler flags and clock branch were written from a Windows
      # host. Running it here is what can turn Linux/macOS limits rows from
      # `not-run` into executed evidence. A probe that does not compile or does
      # not reproduce on POSIX is a finding for the ticket, never a row to
      # delete, so the step copies whatever evidence exists before it fails.
      # It must follow "Generated tree is current": it writes untracked files
      # under tool/runtime_limits_prototype/evidence/, which that gate rejects.
      - name: Runtime limits harness
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        run: |
          suffix=so
          if [ '${{ matrix.platform }}' = 'macos' ]; then suffix=dylib; fi
          library="packages/fjs/libfjs/target/${{ matrix.target }}"
          cargo build --release --locked --manifest-path packages/fjs/libfjs/Cargo.toml --target '${{ matrix.target }}'
          status=0
          python tool/runtime_limits_prototype/verify.py \
            "$library/release/libfjs.$suffix" "$library/debug/libfjs.$suffix" || status=$?
          # Only this run's files are uploaded: the committed manifest.json,
          # gates.log and windows-*.json next to them are the Windows record, and
          # the harness has not touched them if it did not reach its end.
          mkdir -p ".ci-results/runtime-limits-${{ matrix.platform }}"
          cp tool/runtime_limits_prototype/evidence/'${{ matrix.platform }}'-*.json \
             ".ci-results/runtime-limits-${{ matrix.platform }}/" 2>/dev/null \
            || echo 'the harness wrote no per-platform evidence; see this step log'
          if ! git diff --quiet -- tool/runtime_limits_prototype/evidence/manifest.json; then
            cp tool/runtime_limits_prototype/evidence/manifest.json \
               tool/runtime_limits_prototype/evidence/gates.log \
               ".ci-results/runtime-limits-${{ matrix.platform }}/"
          fi
          exit "$status"
      - name: Coverage boundaries
        if: always()
        run: |
          echo '### Coverage boundaries' >> "$GITHUB_STEP_SUMMARY"
          echo '- Native compilation is checked for the selected target; a build is not a runtime verdict.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Every platform job now builds the app (debug): Windows, Linux and macOS desktop bundles, an Android debug APK and an unsigned iOS simulator app. The artifact each build produced is recorded with its path and sha256 in .ci-results/, and uploaded with this run.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Windows: the app build and the bounded runtime/differential gates, and the limits rows executed on a Windows host (committed under tool/runtime_limits_prototype/evidence/). CI does not perform manual UI review or a driven run.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Linux/macOS: the app build, the same shared gate list as Windows (runtime, host surface, HTML adapter, brokers, scoped/nested execution, both frozen differentials), the Dart tests, and the runtime-limits harness executed on the runner — the first execution of probes that had only run from a Windows host. WebView integration is not covered: it stays the rows #2 owns.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Android/iOS: the app builds, and the native library is cross-built. No device or simulator is attached, so launch smoke, driven runs and the limits rows for these platforms stay not-run.' >> "$GITHUB_STEP_SUMMARY"
          echo '- An app build is a shell row: it does not make any platform compatible. ADR 0002/0009 still require the limits rows and the #2 WebView rows of that platform before it can claim a capability.' >> "$GITHUB_STEP_SUMMARY"
          echo '- No full frozen-Legado compatibility claim follows from a green workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Runtime gate commands fail when their log contains the Dart VM crash marker, even if the process exited 0.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: evidence-${{ matrix.platform }}
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: ignore

  # The 32-bit allocation boundary (#111). Android armv7 carries this code in the
  # APK -- `libfjs.so` is built for arm64-v8a, armeabi-v7a and x86_64 -- and no
  # probe has ever executed a 32-bit build. This job executes the same guard
  # arithmetic and the same transfer boundary in an i686 Linux process: the
  # pinned limit check wraps there, the vendored guard must refuse the request
  # and keep the ArrayBuffer, and the row is run again against the unguarded
  # build copy to record the failure. A 32-bit Linux binary is arithmetic and
  # engine evidence for armv7, never an Android-device run.
  #
  # r6 failed to build. r7 built, but its rows never ran: `--exact` was given a
  # bare function name, libtest needs the full `tests::memory_tests::…` path, so
  # every row reported "running 0 tests … 633 filtered out" and exited 0, and
  # the step's bare `test` statements could not fail a `set +e` script. r7 also
  # showed that an explicit `--target=i686-unknown-linux-gnu` fails while no
  # BINDGEN_EXTRA_CLANG_ARGS at all succeeds: bindgen inserts the cargo target
  # itself (`bindgen lib.rs:729-795`: with no explicit `--target` in its clang
  # arguments it uses `TARGET` and inserts `--target=<triple>`), so "no
  # explicit target" is the configuration that produces 32-bit bindings, and
  # nothing may be run until that ABI is asserted.
  #
  # r8 therefore: picks rows with a filter that libtest actually matches and
  # asserts the count of tests that ran; runs the same filter on a 64-bit host
  # build first as the filter control; records the r6-shaped explicit target as
  # a diagnosis-only build; gates every row behind an ABI gate (generated
  # `JSValue` is the nan-boxed `u64`, the effective macros are 32-bit for both
  # `clang` and `gcc -m32`, and the row is listed in the binary); and makes every
  # check fail closed -- no bare `test` statements, an accumulated failure flag
  # and a final `exit`.
  linux-i686:
    name: linux-i686
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The red run restores the build script the review audited
          # (`1eea0eb`) and the probe branch gains a commit per round, so the
          # job takes the whole history rather than guessing a depth.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.97.0'
          targets: i686-unknown-linux-gnu
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/fjs/libfjs/target
          key: native-i686-unknown-linux-gnu-${{ hashFiles('packages/fjs/libfjs/Cargo.lock', 'packages/fjs/libfjs/vendor/**', '.github/workflows/ci.yml') }}
          restore-keys: native-i686-unknown-linux-gnu-
      # The 64-bit filter control builds the same crate for the runner's own
      # target; this reuses the Linux platform job's cache when it exists.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/fjs/libfjs/target
          key: native-x86_64-unknown-linux-gnu-${{ hashFiles('packages/fjs/libfjs/Cargo.lock', 'packages/fjs/libfjs/vendor/**', '.github/workflows/ci.yml') }}
          restore-keys: native-x86_64-unknown-linux-gnu-
      - name: 32-bit build dependencies
        run: |
          # gcc-multilib supplies the 32-bit glibc headers and the `gcc -m32`
          # driver the `cc` crate links the vendored QuickJS with; clang and
          # libclang build it and generate its bindings.
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config libssl-dev gcc-multilib
      - name: Probe inputs
        run: |
          set +e
          fail=0
          git rev-parse HEAD
          git log --oneline -5
          rustc -vV
          sha256sum \
            packages/fjs/libfjs/vendor/rquickjs-sys/build.rs \
            packages/fjs/libfjs/vendor/rquickjs-sys/quickjs/quickjs.c \
            packages/fjs/libfjs/vendor/rquickjs-sys/src/inlines/ptr_32_nan_boxing.rs \
            packages/fjs/libfjs/src/tests/memory_tests.rs | tee probe-inputs.sha256
          # The red run needs this object; fail here instead of there.
          if ! git cat-file -e 1eea0ebfdc77478f8fa2f5958d7d337b369ed52b^{commit}; then
            echo 'FAIL: the review-audited commit 1eea0eb is not in the history' | tee -a probe-inputs.sha256
            fail=1
          fi
          exit "$fail"
      # Informational, never a gate: the rustc target's own width, whether both C
      # toolchains build and run a 32-bit binary, where each looks for headers,
      # and -- the question r6 got wrong -- which target macros the vendored
      # header resolves to under each bindgen configuration.
      - name: Toolchain, headers and target macros
        run: |
          set +e
          {
            echo '== rustc target cfg =='
            rustc --print cfg --target i686-unknown-linux-gnu \
              | grep -E 'target_arch|target_os|target_env|pointer_width|target_pointer' | sort
            printf '#include <stddef.h>\n#include <stdint.h>\n_Static_assert(sizeof(void *) == 4, "pointer width");\n_Static_assert(sizeof(size_t) == 4, "size_t width");\nint main(void) { return 0; }\n' > probe32.c
            echo '== gcc -m32 =='
            gcc -m32 probe32.c -o probe32-gcc
            echo "gcc -m32 build exit=$?"
            ./probe32-gcc
            echo "gcc -m32 run exit=$?"
            echo '== clang --target=i686-unknown-linux-gnu =='
            clang --target=i686-unknown-linux-gnu probe32.c -o probe32-clang
            echo "clang --target build exit=$?"
            ./probe32-clang
            echo "clang --target run exit=$?"
            echo '== clang include search path, host default =='
            clang -E -v -xc /dev/null 2>&1 \
              | sed -n '/#include <...> search starts here/,/End of search list/p'
            echo '== clang include search path, --target=i686-unknown-linux-gnu =='
            clang --target=i686-unknown-linux-gnu -E -v -xc /dev/null 2>&1 \
              | sed -n '/#include <...> search starts here/,/End of search list/p'
            echo '== multiarch header directories and packages =='
            ls -d /usr/include/i386-linux-gnu /usr/include/x86_64-linux-gnu 2>&1
            dpkg -l | grep -E 'gcc-multilib|libc6-dev|libc6-i386' | head -20
            echo '== environment =='
            env | grep -E 'BINDGEN|^CC|^CXX|CFLAGS|^TARGET|CARGO_TARGET' | sort
            header=packages/fjs/libfjs/vendor/rquickjs-sys/quickjs.bind.h
            include=packages/fjs/libfjs/vendor/rquickjs-sys/quickjs
            macros() {
              grep -E '^#define (__i386__|__x86_64__|__ILP32__|__SIZEOF_POINTER__|INTPTR_MAX|INT64_MAX|JS_NAN_BOXING)' | sort
            }
            echo '== vendored header macros: clang, host default =='
            clang -E -dM -xc "$header" -I"$include" -D_GNU_SOURCE 2>&1 | macros
            echo '== vendored header macros: clang, --target first (bindgen inserts it here) =='
            clang -E -dM -xc --target=i686-unknown-linux-gnu "$header" -I"$include" -D_GNU_SOURCE 2>&1 | macros
            echo '== vendored header macros: clang, --target last (BINDGEN_EXTRA_CLANG_ARGS position) =='
            clang -E -dM -xc "$header" -I"$include" -D_GNU_SOURCE --target=i686-unknown-linux-gnu 2>&1 | macros
            echo '== vendored header macros: gcc -m32 (the ABI the cc crate compiles) =='
            gcc -m32 -E -dM -xc "$header" -I"$include" -D_GNU_SOURCE 2>&1 | macros
          } 2>&1 | tee toolchain-probe.log
          exit 0
      # The filter control: the same row, the same filter, on the 64-bit host
      # binary. It must be selected and must report the row's not-applicable
      # path, which is what proves the filter selects a row at all.
      - name: Evidence helpers
        run: |
          set -e
          # Written once so the later steps (and the artifact) use the same
          # renderers and checks; a malformed helper fails here, not at a row.
          cat > render_diagnostics.py <<'PY'
          """Print the diagnostics cargo embedded in its JSON message stream.

          `--message-format=json` sends the rendered diagnostics to stdout, so a
          build that redirects stdout to a file loses them unless they are
          rendered back out. Errors come first, then warnings, then the rest.
          """
          import json
          import sys

          path, want = sys.argv[1], int(sys.argv[2])
          groups = {'error': [], 'warning': [], 'other': []}
          plain = []
          for line in open(path, encoding='utf-8', errors='replace'):
              line = line.strip()
              if not line:
                  continue
              if not line.startswith('{'):
                  plain.append(line)
                  continue
              try:
                  message = json.loads(line)
              except json.JSONDecodeError:
                  plain.append(line)
                  continue
              if message.get('reason') != 'compiler-message':
                  continue
              body = message.get('message') or {}
              rendered = body.get('rendered')
              level = body.get('level')
              if not rendered or level == 'note':
                  continue
              key = 'error' if level == 'error' else 'warning' if level == 'warning' else 'other'
              groups[key].append(rendered)
          for level, rendered in groups.items():
              print(f'--- {len(rendered)} {level}-level diagnostics ---')
              for text in rendered[:want]:
                  print(text, end='')
          print(f'--- {len(plain)} untyped lines ---')
          for text in plain[:want]:
              print(text)
          PY
          cat > test_binary_path.py <<'PY'
          """Print the first test executable of `fjs` in a cargo JSON stream."""
          import json
          import sys

          for line in open(sys.argv[1], encoding='utf-8', errors='replace'):
              line = line.strip()
              if not line.startswith('{'):
                  continue
              try:
                  artifact = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if (artifact.get('reason') == 'compiler-artifact'
                      and artifact.get('target', {}).get('name') == 'fjs'
                      and artifact.get('executable')):
                  print(artifact['executable'])
          PY
          cat > check_row_log.py <<'PY'
          """Fail-closed checks that the selected libtest row ran as expected.

          Usage: check_row_log.py <log> passed|red-debug|red-wrap <exit-status> [marker...]
          """
          import re
          import sys

          path, mode, status = sys.argv[1], sys.argv[2], int(sys.argv[3])
          markers = sys.argv[4:]
          text = open(path, encoding="utf-8", errors="replace").read()
          problems = []

          starts = len(re.findall(r"(?m)^running 1 test(?:\s|$)", text))
          if starts != 1:
              problems.append(f"the row started {starts} times, expected exactly once")
          if re.search(r"(?m)^running 0 tests(?:\s|$)", text):
              problems.append("the filter selected no test ('running 0 tests')")

          if mode == "passed":
              if not re.search(r"test result: ok\. 1 passed", text):
                  problems.append("the row did not report exactly one passing test")
              if status != 0:
                  problems.append(f"the row exited {status}")
          elif mode in ("red-debug", "red-wrap"):
              if status == 0:
                  problems.append("the red row exited 0; it was expected to fail")
              if re.search(r"test result: ok\. 1 passed", text):
                  problems.append("the red row reported a passing test")
              if not markers:
                  problems.append("no required boundary progress marker was supplied")
              for marker in markers:
                  if marker not in text:
                      problems.append(f"the log does not carry {marker!r}")
              after_boundary = text[text.find(markers[0]):] if markers and markers[0] in text else ""
              assertion_failure = (
                  "panicked at" in after_boundary
                  and (
                      "16 MiB limit: transfer(4294967295) must be refused as JsError_MemoryLimit"
                      in after_boundary
                      or "16 MiB limit: transfer(4294967295): a refused transfer must leave the original ArrayBuffer attached and unchanged"
                      in after_boundary
                  )
              )
              if mode == "red-debug":
                  allocator_overflow = (
                      "panicked at" in after_boundary
                      and "attempt to multiply with overflow" in after_boundary
                  )
                  if not (assertion_failure or allocator_overflow):
                      problems.append(
                          "debug red log lacks the exact first-boundary assertion or allocator-rounding overflow panic"
                      )
              else:
                  bounded_memory_fault = (
                      status == 139
                      and re.search(r"Segmentation fault|SIGSEGV|signal 11", after_boundary, re.IGNORECASE)
                  )
                  if not (assertion_failure or bounded_memory_fault):
                      problems.append(
                          "wrap red log lacks the exact first-boundary assertion or bounded SIGSEGV evidence"
                      )
          else:
              problems.append(f"unknown mode {mode!r}")

          if problems:
              for problem in problems:
                  print(f"FAIL: {problem}")
              sys.exit(1)
          print("ok: the row ran and matched every expectation")
          PY
            python3 -m py_compile render_diagnostics.py test_binary_path.py check_row_log.py
      - name: 64-bit filter control (host build)
        run: |
          set +e
          fail=0
          manifest=packages/fjs/libfjs/Cargo.toml
          row=pointer_width_transfer_boundaries_report_and_keep_the_buffer
          cargo test --locked --manifest-path "$manifest" --target x86_64-unknown-linux-gnu \
            --no-run --message-format=json > host-artifacts.json 2> host-build.log
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "FAIL: the 64-bit control build exited $status" | tee control-status.log
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            python3 test_binary_path.py host-artifacts.json > host-binary.path
            hostbin="$(cat host-binary.path)"
            if [ -z "$hostbin" ]; then
              echo 'FAIL: the 64-bit control build produced no test binary' | tee -a control-status.log
              fail=1
            else
              "$hostbin" --list | tee host-list.log
              if ! grep -qF "$row" host-list.log; then
                echo "FAIL: the row is not listed in the 64-bit binary; the filter cannot select it" | tee -a control-status.log
                fail=1
              fi
              "$hostbin" "$row" --nocapture --test-threads=1 > host-row.log 2>&1
              host_status=$?
              echo "host_row_status=$host_status" >> host-row.log
              if ! python3 check_row_log.py host-row.log passed "$host_status" 'not-applicable on a 64-bit target' >> control-status.log; then
                fail=1
              fi
            fi
          fi
          if [ "$fail" -eq 0 ]; then
            echo 'control=ok: the filter selects the row and the 64-bit row prints not-applicable' | tee -a control-status.log
          fi
          exit "$fail"
      # The 32-bit build. The r6-shaped explicit target is recorded first as a
      # diagnosis-only build (its 30 errors are what r6 lost), then the bindgen
      # argument shapes are tried in turn and the first that compiles is used.
      - name: Build the 32-bit test binary (bindgen arguments in turn)
        run: |
          set +e
          fail=0
          manifest=packages/fjs/libfjs/Cargo.toml
          target=i686-unknown-linux-gnu
          : > bindgen-attempts.log
          : > bindgen-diagnosis.log

          # 1. r6's configuration, diagnosis only: an explicit target in the
          #    unsuffixed variable. r6 lost these diagnostics, so record them.
          cargo clean -p rquickjs-sys --manifest-path "$manifest" --target "$target" >/dev/null 2>&1
          ( env -u BINDGEN_EXTRA_CLANG_ARGS_i686-unknown-linux-gnu \
              BINDGEN_EXTRA_CLANG_ARGS=--target=i686-unknown-linux-gnu \
              cargo test --locked --manifest-path "$manifest" --target "$target" --no-run \
              --message-format=json ) > test-artifacts-explicit-target.json 2> test-build-explicit-target.log
          explicit_status=$?
          echo "=== diagnosis attempt explicit-target: cargo exit=$explicit_status" | tee -a bindgen-diagnosis.log
          python3 render_diagnostics.py test-artifacts-explicit-target.json 40 \
            2>&1 | tee rendered-diagnostics-explicit-target.log | tee -a bindgen-diagnosis.log

          # 2. The bindgen argument shapes, in order. No BINDGEN_EXTRA_CLANG_ARGS
          #    is first: bindgen then inserts `--target=<cargo TARGET>` itself, so
          #    the bindings match the 32-bit target. `BINDGEN_EXTRA_CLANG_ARGS_<triple>`
          #    is not a valid shell identifier, so each attempt runs under `env`.
          attempts='host-default suffixed-target suffixed-target-include'
          build=1
          winning=none
          for label in $attempts; do
            case "$label" in
              host-default)
                args=''
                runner=(env -u BINDGEN_EXTRA_CLANG_ARGS -u BINDGEN_EXTRA_CLANG_ARGS_i686-unknown-linux-gnu) ;;
              suffixed-target)
                args='--target=i686-unknown-linux-gnu'
                runner=(env -u BINDGEN_EXTRA_CLANG_ARGS "BINDGEN_EXTRA_CLANG_ARGS_i686-unknown-linux-gnu=$args") ;;
              suffixed-target-include)
                args='--target=i686-unknown-linux-gnu -I/usr/include/i386-linux-gnu'
                runner=(env -u BINDGEN_EXTRA_CLANG_ARGS "BINDGEN_EXTRA_CLANG_ARGS_i686-unknown-linux-gnu=$args") ;;
            esac
            echo '=== attempt %s: bindgen args %s (%s)\n' "$label" "${args:-none}" "${runner[*]}" \' >> abi-gate.log
            cargo clean -p rquickjs-sys --manifest-path "$manifest" --target "$target" >/dev/null 2>&1
            "${runner[@]}" cargo test --locked --manifest-path "$manifest" --target "$target" --no-run \
              --message-format=json > "test-artifacts-$label.json" 2> "test-build-$label.log"
            status=$?
            echo "attempt $label: cargo exit=$status" | tee -a bindgen-attempts.log
            python3 render_diagnostics.py "test-artifacts-$label.json" 40 \
              2>&1 | tee "rendered-diagnostics-$label.log" | grep -E '^(---|error|warning)' | head -20 \
              | tee -a bindgen-attempts.log
            target_root="packages/fjs/libfjs/target/$target"
            bindings="$(find "$target_root" -path '*/out/bindings.rs' -print | sort | head -1)"
            if [ -n "$bindings" ]; then
              printf 'target bindings %s\n' "$bindings" | tee -a "bindings-$label.log"
              grep -nE 'pub (struct|union|type) JSValue|pub (struct|union) JSValueUnion' "$bindings" \
                | tee -a "bindings-$label.log"
              sha256sum "$bindings" | tee -a "bindings-$label.log"
            else
              echo "target bindings $label: none generated under $target_root" | tee -a "bindings-$label.log"
            fi
            header="$(find "$target_root" -path '*/out/quickjs.bind.h' -print | sort | head -1)"
            if [ -n "$header" ]; then
              printf 'header %s\n' "$header" > "macros-$label.log"
              echo "== the attempt's own arguments ==" >> "macros-$label.log"
              "${runner[@]}" clang -E -dM -xc "$header" -D_GNU_SOURCE 2>&1 | grep -E '__i386__|__x86_64__|__SIZEOF_POINTER__|INTPTR_MAX|INT64_MAX|JS_NAN_BOXING' | sort >> "macros-$label.log"
              echo "== bindgen's effective target (it inserts the cargo target itself) ==" >> "macros-$label.log"
              clang -E -dM -xc --target=i686-unknown-linux-gnu "$header" -D_GNU_SOURCE 2>&1 | grep -E '__i386__|__x86_64__|__SIZEOF_POINTER__|INTPTR_MAX|INT64_MAX|JS_NAN_BOXING' | sort >> "macros-$label.log"
              tee -a bindgen-attempts.log < "macros-$label.log"
            else
              echo "header $label: none generated" | tee -a "macros-$label.log"
            fi
            if [ "$status" -eq 0 ]; then
              build=0
              winning="$label"
              cp "test-artifacts-$label.json" test-artifacts.json
              python3 test_binary_path.py "test-artifacts-$label.json" > test-binary.path
              printf '%s\n' "$label" > bindgen-winner.label
              if [ -n "$bindings" ]; then printf '%s\n' "$bindings" > bindings.path; fi
              break
            fi
          done
          if [ "$build" -ne 0 ]; then
            echo 'FAIL: no bindgen argument shape compiled the 32-bit test binary' | tee -a bindgen-attempts.log
            fail=1
          fi
          printf 'explicit_target_status=%s build=%s winning_attempt=%s\n' \
            "$explicit_status" "$build" "$winning" | tee probe-status.log
          exit "$fail"
      # No row runs until the 32-bit bindings are shown to be the 32-bit ABI:
      # the nan-boxed `JSValue = u64` the C library is also compiled with.
      - name: 32-bit ABI gate
        run: |
          set +e
          fail=0
          target=i686-unknown-linux-gnu
          : > abi-gate.log
          winner="$(cat bindgen-winner.label 2>/dev/null || echo none)"
          bindings="$(cat bindings.path 2>/dev/null || true)"
          echo "winning_attempt=$winner" | tee -a abi-gate.log
          bin="$(cat test-binary.path 2>/dev/null || true)"
          if [ -z "$bindings" ] || [ ! -s "$bindings" ]; then
            echo 'FAIL: no generated bindings to judge the ABI by' | tee -a abi-gate.log
            fail=1
          fi
          # Bindgen can emit the type mid-line and put whitespace before `;`.
          if [ "$fail" -eq 0 ] && ! grep -qE 'pub type JSValue[[:space:]]*=[[:space:]]*u64[[:space:]]*;' "$bindings"; then
            echo 'FAIL: the generated bindings do not carry the 32-bit nan-boxed JSValue' | tee -a abi-gate.log
            grep -nE 'pub (struct|union|type) JSValue' "$bindings" | tee -a abi-gate.log
            fail=1
          fi
          target_root="packages/fjs/libfjs/target/$target"
          target_root_abs="$(realpath "$target_root" 2>/dev/null || true)"
          if [ -z "$target_root_abs" ]; then
            echo "FAIL: missing target tree $target_root" | tee -a abi-gate.log
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            bindings_abs="$(realpath "$bindings" 2>/dev/null || true)"
            case "$bindings_abs" in
              "$target_root_abs"/*) ;;
              *) echo "FAIL: bindings are not under $target_root: $bindings" | tee -a abi-gate.log; fail=1 ;;
            esac
          fi
          header="$(find "$target_root" -path '*/out/quickjs.bind.h' -print | sort | head -1)"
          macros() {
            grep -E '^#define (__i386__|__x86_64__|__ILP32__|__SIZEOF_POINTER__|INTPTR_MAX|JS_NAN_BOXING)' | sort
          }
          if [ -z "$header" ] || [ ! -s "$header" ]; then
            echo "FAIL: no generated QuickJS header under $target_root" | tee -a abi-gate.log
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then
            echo "== clang, bindgen target ($target) ==" >> abi-gate.log
            clang -E -dM -xc --target="$target" "$header" -D_GNU_SOURCE 2>&1 | macros >> abi-gate.log
            echo '== gcc -m32, the ABI the cc crate compiles ==' >> abi-gate.log
            gcc -m32 -E -dM -xc "$header" -D_GNU_SOURCE 2>&1 | macros >> abi-gate.log
            # A compile-time probe of the vendored header, not a grep of macro
            # text: it fails unless the pointer width, the nan-boxing switch and
            # the nan-boxed JSValue are the 32-bit ones.
            include="$(dirname "$header")"
            cat > abi_probe.c <<'PROBE'
          #include <stddef.h>
          #include <stdint.h>
          #include "quickjs.h"
          _Static_assert(sizeof(void *) == 4, "32-bit pointers");
          _Static_assert(sizeof(size_t) == 4, "32-bit size_t");
          _Static_assert(JS_NAN_BOXING == 1, "nan boxing off");
          _Static_assert(sizeof(JSValue) == 8, "JSValue is not one nan-boxed u64");
          int main(void) { return 0; }
          PROBE
            echo '== gcc -m32 compiles the header probe ==' >> abi-gate.log
            if ! gcc -m32 -I"$include" -D_GNU_SOURCE -c abi_probe.c -o abi_probe_gcc_m32.o >> abi-gate.log 2>&1; then
              echo 'FAIL: gcc -m32 rejects the 32-bit ABI probe' | tee -a abi-gate.log
              fail=1
            fi
            echo '== clang --target compiles the header probe ==' >> abi-gate.log
            if ! clang --target="$target" -I"$include" -D_GNU_SOURCE -c abi_probe.c -o abi_probe_clang.o >> abi-gate.log 2>&1; then
              echo 'FAIL: clang --target=i686-unknown-linux-gnu rejects the 32-bit ABI probe' | tee -a abi-gate.log
              fail=1
            fi
            # Sensitivity control: the same probe must be rejected on the host,
            # otherwise the two compilations above prove nothing.
            echo '== host control: the same probe must be rejected ==' >> abi-gate.log
            if gcc -I"$include" -D_GNU_SOURCE -c abi_probe.c -o abi_probe_host.o >> abi-gate.log 2>&1; then
              echo 'FAIL: the host build accepted the 32-bit ABI probe; the probe is not selective' | tee -a abi-gate.log
              fail=1
            fi
          fi
          if [ "$fail" -eq 0 ]; then
            if [ -z "$bin" ] || [ ! -x "$bin" ]; then
              echo 'FAIL: no 32-bit test binary to run' | tee -a abi-gate.log
              fail=1
            else
              # Cargo reports this executable as an absolute path.
              bin_abs="$(realpath "$bin" 2>/dev/null || true)"
              case "$bin_abs" in
                "$target_root_abs"/*) ;;
                *) echo "FAIL: test binary is not under $target_root: $bin" | tee -a abi-gate.log; fail=1 ;;
              esac
              if [ "$fail" -eq 0 ]; then
                file "$bin" | tee -a abi-gate.log
                readelf -hW "$bin" | tee -a abi-gate.log
                if ! file "$bin" | grep -q 'ELF 32-bit.*Intel 80386'; then
                  echo 'FAIL: test binary is not ELF32 Intel 80386' | tee -a abi-gate.log
                  fail=1
                fi
                if ! readelf -hW "$bin" | grep -qE 'Class:[[:space:]]+ELF32' \
                    || ! readelf -hW "$bin" | grep -qE 'Machine:[[:space:]]+Intel 80386'; then
                  echo 'FAIL: readelf does not identify an ELF32 Intel 80386 test binary' | tee -a abi-gate.log
                  fail=1
                fi
              fi
              if [ "$fail" -eq 0 ]; then
                "$bin" --list | tee i686-list.log
                if ! grep -qF pointer_width_transfer_boundaries_report_and_keep_the_buffer i686-list.log; then
                  echo 'FAIL: the row is not listed in the 32-bit binary' | tee -a abi-gate.log
                  fail=1
                fi
              fi
            fi
          fi
          cat abi-gate.log
          if [ "$fail" -eq 0 ]; then echo 'abi_gate=ok' | tee -a probe-status.log; else echo 'abi_gate=failed' | tee -a probe-status.log; fi
          exit "$fail"
      - name: Green — the guarded build copy refuses the wrapped requests
        run: |
          set +e
          fail=0
          : > green-status.log
          bin="$(cat test-binary.path)"
          : > build-copy-guards.log
          found=0
          while read -r copy; do
            helpers=$(grep -c 'js_malloc_limit_exceeded' "$copy")
            layout=$(grep -c 'JS_ALLOC_LAYOUT_PADDING' "$copy")
            guards=$(grep -c '#if UINTPTR_MAX < UINT64_MAX' "$copy")
            printf '%s helper_lines=%s layout_lines=%s guard_lines=%s\n' \
              "$copy" "$helpers" "$layout" "$guards" | tee -a build-copy-guards.log
            if [ "$helpers" = 4 ] && [ "$layout" = 3 ] && [ "$guards" = 1 ]; then found=1; fi
          done < <(find "packages/fjs/libfjs/target/i686-unknown-linux-gnu" -path '*/out/quickjs.c')
          if [ "$found" -ne 1 ]; then
            echo 'FAIL: the guarded build copy was not found' | tee -a green-status.log
            fail=1
          fi
          run_row() {
            label="$1"
            row="$2"
            shift 2
            log="green-32bit-$label.log"
            "$bin" "$row" --nocapture --test-threads=1 > "$log" 2>&1
            status=$?
            echo "green_row=$label status=$status" >> "$log"
            if ! python3 check_row_log.py "$log" passed "$status" "$@" >> green-status.log; then
              echo "FAIL: green row $label" >> green-status.log
              fail=1
            fi
            tail -20 "$log"
          }
          run_row pointer-width pointer_width_transfer_boundaries_report_and_keep_the_buffer \
            'FJS pointer-width row (16 MiB limit): malloc_size=' \
            'FJS pointer-width row (no limit): malloc_size=' \
            'buffer=8|false|7,7,7,7,7,7,7,7'
          # 200 iterations: FJS_HEAP_LIMIT_ROW_ITERATIONS is set for the job.
          run_row heap-single-request single_request_heap_limit_shape_reports_the_memory_limit \
            'FJS heap-limit single-request: 200 runs'
          run_row heap-accumulating accumulating_heap_limit_shape_reports_the_memory_limit \
            'FJS heap-limit row #0:'
          run_row heap-fine-grained fine_grained_accumulation_reports_the_memory_limit \
            'FJS heap-limit row #0:'
          cat green-status.log
          exit "$fail"
      - name: Red — the unguarded build copy accepts them
        run: |
          set +e
          fail=0
          : > red-status.log
          # The red run reverts only the build script, to the bytes the review
          # audited (`accepted`); the test source and the compiler stay the same,
          # and both blob hashes are recorded so a wrong revision fails here
          # instead of running a green row as a red one.
          accepted=1eea0ebfdc77478f8fa2f5958d7d337b369ed52b
          path=packages/fjs/libfjs/vendor/rquickjs-sys/build.rs
          row=pointer_width_transfer_boundaries_report_and_keep_the_buffer
          git checkout "$accepted" -- "$path"
          printf 'reverted to %s\n' "$accepted" > red-build-source.commit
          printf 'blob now %s\n' "$(git hash-object "$path")" >> red-build-source.commit
          printf 'blob at %s %s\n' "$accepted" "$(git rev-parse "$accepted:$path")" >> red-build-source.commit
          if [ "$(git hash-object "$path")" != "$(git rev-parse "$accepted:$path")" ]; then
            echo 'FAIL: the reverted build script is not the audited revision' | tee -a red-status.log
            fail=1
          fi
          if grep -qF 'js_malloc_limit_exceeded' "$path"; then
            echo 'FAIL: the reverted build script still carries the guard' | tee -a red-status.log
            fail=1
          fi
          sha256sum "$path" > red-build.rs.sha256
          winner="$(cat bindgen-winner.label 2>/dev/null || true)"
          case "$winner" in
            host-default)
              red_runner=(env -u BINDGEN_EXTRA_CLANG_ARGS -u BINDGEN_EXTRA_CLANG_ARGS_i686-unknown-linux-gnu) ;;
            suffixed-target)
              red_runner=(env -u BINDGEN_EXTRA_CLANG_ARGS \
                BINDGEN_EXTRA_CLANG_ARGS_i686-unknown-linux-gnu=--target=i686-unknown-linux-gnu) ;;
            suffixed-target-include)
              red_runner=(env -u BINDGEN_EXTRA_CLANG_ARGS \
                'BINDGEN_EXTRA_CLANG_ARGS_i686-unknown-linux-gnu=--target=i686-unknown-linux-gnu -I/usr/include/i386-linux-gnu') ;;
            *)
              echo "FAIL: missing or unknown bindgen winner '$winner'; refusing red builds" | tee -a red-status.log
              fail=1 ;;
          esac
          for profile in debug wrap; do
            if [ "$fail" -ne 0 ]; then break; fi
            flags=''
            if [ "$profile" = 'wrap' ]; then
              # A debug build stops at the allocator's own overflow check; the
              # product is built with overflow checks off, where the rounding
              # wraps and the request reaches the transfer's memset.
              flags='-C debug-assertions=off -C overflow-checks=off'
            fi
            RUSTFLAGS="$flags" "${red_runner[@]}" cargo test --locked \
              --manifest-path packages/fjs/libfjs/Cargo.toml \
              --target i686-unknown-linux-gnu --no-run --message-format=json \
              > "red-$profile-artifacts.json" 2> "red-$profile-build.log"
            built=$?
            echo "red_build_$profile=$built" >> red-status.log
            if [ "$built" -ne 0 ]; then
              echo "FAIL: the $profile red build exited $built" >> red-status.log
              fail=1
              continue
            fi
            python3 test_binary_path.py "red-$profile-artifacts.json" > "red-$profile.path"
            redbin="$(cat "red-$profile.path")"
            target_root=packages/fjs/libfjs/target/i686-unknown-linux-gnu
            if [ -z "$redbin" ] || [ ! -x "$redbin" ]; then
              echo "FAIL: the $profile red build produced no test binary" >> red-status.log
              fail=1
              continue
            fi
            case "$redbin" in
              "$target_root"/*) ;;
              *) echo "FAIL: $profile red binary is not under $target_root: $redbin" >> red-status.log; fail=1; continue ;;
            esac
            printf 'executable=%s\n' "$redbin" | tee "red-$profile-elf.log"
            sha256sum "$redbin" | tee -a "red-$profile-elf.log"
            file "$redbin" | tee -a "red-$profile-elf.log"
            readelf -hW "$redbin" | tee -a "red-$profile-elf.log"
            if ! file "$redbin" | grep -q 'ELF 32-bit.*Intel 80386' \
                || ! readelf -hW "$redbin" | grep -qE 'Class:[[:space:]]+ELF32' \
                || ! readelf -hW "$redbin" | grep -qE 'Machine:[[:space:]]+Intel 80386'; then
              echo "FAIL: $profile red binary is not ELF32 Intel 80386" >> red-status.log
              fail=1
              continue
            fi
            "$redbin" --list > "red-$profile-list.log"
            if ! grep -qF "$row" "red-$profile-list.log"; then
              echo "FAIL: the row is not listed in the $profile red binary" >> red-status.log
              fail=1
              continue
            fi
            log="red-$profile-32bit.log"
            # `stdbuf -oL` keeps the harness's own lines flushed, so a crashed
            # row still shows that it started. The 256 MiB address space bounds
            # the ~4 GB clear inside one process, where the write faults.
            ( ulimit -v 262144; echo "ulimit -v $(ulimit -v)"; stdbuf -oL -eL \
                timeout -s KILL 120 "$redbin" "$row" --nocapture --test-threads=1 ) > "$log" 2>&1
            red=$?
            echo "red_status=$red" >> "$log"
            if ! python3 check_row_log.py "$log" "red-$profile" "$red" \
                'FJS pointer-width boundary begin context=16 MiB limit size=4294967295' >> red-status.log; then
              echo "FAIL: red row $profile did not fail as expected" >> red-status.log
              fail=1
            fi
            tail -20 "$log"
          done
          git checkout HEAD -- "$path"
          if ! grep -qF 'js_malloc_limit_exceeded' "$path"; then
            echo 'FAIL: the guarded build script was not restored' | tee -a red-status.log
            fail=1
          fi
          cat red-status.log
          exit "$fail"
      - name: Coverage boundaries
        if: always()
        run: |
          echo '### 32-bit allocation boundary (#111)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Every row is gated behind an ABI check (nan-boxed `JSValue = u64` in the generated bindings, 32-bit target macros for `clang` and `gcc -m32`, the row listed in the binary) and a count of tests that actually ran; `running 0 tests` is a failure, not a pass.' >> "$GITHUB_STEP_SUMMARY"
          echo '- The same filter runs on the 64-bit host binary first as the filter control.' >> "$GITHUB_STEP_SUMMARY"
          echo '- The unguarded run is the accepted candidate build script, bounded by a 256 MiB address space and a hard timeout.' >> "$GITHUB_STEP_SUMMARY"
          echo '- This is arithmetic and engine evidence, not an Android-device run: the armv7 row stays not-run.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: probe-111-linux-i686
          path: |
            probe-inputs.sha256
            toolchain-probe.log
            host-build.log
            host-artifacts.json
            host-binary.path
            host-list.log
            host-row.log
            control-status.log
            bindgen-diagnosis.log
            rendered-diagnostics-explicit-target.log
            bindgen-attempts.log
            bindgen-winner.label
            test-artifacts.json
            test-artifacts-*.json
            red-*-artifacts.json
            test-build-*.log
            test-binary.path
            bindings.path
            rendered-diagnostics-*.log
            bindings-*.log
            macros-*.log
            abi-gate.log
            abi_probe.c
            i686-list.log
            render_diagnostics.py
            test_binary_path.py
            check_row_log.py
