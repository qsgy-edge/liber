name: '#111 Android x86_64 emulator runtime probe'

# Diagnostic branch only. Its push event runs this workflow without adding a
# permanent simulator dependency to the product's main CI.
on:
  push:
    branches:
      - probe/111-b20-r9
    paths:
      - .github/workflows/111-android-runtime-probe.yml

permissions:
  contents: read

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  android-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.97.0'
          targets: x86_64-linux-android
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Install native build prerequisites and verify KVM
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee probe-commit.txt
          sha256sum integration_test/heap_limit_mobile_probe_test.dart | tee probe-source.sha256
          if [ ! -e /dev/kvm ]; then
            echo 'ANDROID_DEVICE_NOT_RUN: /dev/kvm unavailable on this runner'
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build pkg-config libssl-dev
          echo "JAVA_HOME=${JAVA_HOME_17_X64:?JDK 17 not installed}" >> "$GITHUB_ENV"
          flutter pub get --enforce-lockfile
      - name: Run #111 in the Android emulator app process
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ndk: 28.2.13676358
          emulator-boot-timeout: 900
          script: bash tool/111_android_runtime_probe.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: probe-111-android-x86_64-runtime
          path: |
            probe-commit.txt
            probe-source.sha256
            android-abi.txt
            flutter-devices.json
            android-runtime-test.log
          if-no-files-found: ignore
